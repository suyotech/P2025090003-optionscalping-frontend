services:
  optionscalp-frontend:
    image: optionscalp-frontend:v1.0.0
    container_name: optionscalp-frontend
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.optionscalp-frontend.rule=Host(`optionscalp.suyotech.com`) && PathPrefix(`/`)"
      - "traefik.http.services.optionscalp-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.optionscalp-frontend.entrypoints=websecure"
      - "traefik.http.routers.optionscalp-frontend.tls=true"
      - "traefik.http.routers.optionscalp-frontend.priority=100"
    networks:
      - web
networks:
  web:
    external: true